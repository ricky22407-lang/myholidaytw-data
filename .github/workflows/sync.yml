name: Sync datasets from main site

on:
  schedule:
    # 每週六 台灣時間 10:00（UTC 02:00）— 在週五產業報告生成之後
    - cron: "0 2 * * 6"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Pull latest datasets from the live site
        run: |
          mkdir -p data
          # 主站 repo 是 private，但資料檔在網站上公開 — 從 sitemap 列報告 slug 後直接下載
          python3 - <<'PY'
          import re, urllib.request

          UA = {"User-Agent": "myholidaytw-data-sync/1.0"}
          def fetch(url):
              return urllib.request.urlopen(urllib.request.Request(url, headers=UA), timeout=30).read()

          sitemap = fetch("https://www.myholidaytw.com/sitemap.xml").decode()
          slugs = sorted(set(re.findall(r"myholidaytw\.com/reports/([a-z0-9-]+)", sitemap)))
          print(f"reports in sitemap: {len(slugs)}")
          for slug in slugs:
              for ext in ("json", "csv"):
                  url = f"https://www.myholidaytw.com/data/{slug}.{ext}"
                  try:
                      data = fetch(url)
                      open(f"data/{slug}.{ext}", "wb").write(data)
                      print("downloaded", slug + "." + ext)
                  except Exception as e:
                      print("skip", url, e)
          PY
          ls data/

      - name: Update report list in README
        run: |
          python3 - <<'PY'
          import json, glob, re
          rows = []
          for fp in sorted(glob.glob('data/*.json')):
              d = json.load(open(fp))
              slug = fp.split('/')[-1][:-5]
              name = d.get('dataset', slug).replace(' — 研究來源語料庫', '')
              rows.append(f"| {name} | https://www.myholidaytw.com/reports/{slug} |")
          table = "| 資料集 | 報告全文 |\n|---|---|\n" + "\n".join(rows)
          readme = open('README.md', encoding='utf-8').read()
          new = re.sub(r"\| 資料集 \| 報告全文 \|\n\|---\|---\|\n(\|.*\n)*", table + "\n", readme)
          open('README.md', 'w', encoding='utf-8').write(new)
          PY

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ README.md
          if git diff --staged --quiet; then
            echo "no changes"
          else
            git commit -m "chore: sync datasets $(date +%Y-%m-%d)"
            git push
          fi
