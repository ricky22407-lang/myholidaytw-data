name: Sync datasets from main site

on:
  schedule:
    # 每週六 台灣時間 10:00（UTC 02:00）— 在週五產業報告生成之後
    - cron: "0 2 * * 6"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Pull latest datasets from myholidaytw/public/data
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p data
          # 認證請求（runner 共用 IP，未認證 API 會被 rate-limit 回傳 error dict）
          gh api repos/ricky22407-lang/myholidaytw/contents/public/data \
            | python3 -c "
          import json, sys, urllib.request
          files = json.load(sys.stdin)
          if isinstance(files, dict):
              raise SystemExit(f'API error: {files.get(\"message\")}')
          for f in files:
              if f['name'].endswith(('.json', '.csv')):
                  print('downloading', f['name'])
                  urllib.request.urlretrieve(f['download_url'], 'data/' + f['name'])
          "

      - name: Update report list in README
        run: |
          python3 - <<'PY'
          import json, glob, re
          rows = []
          for fp in sorted(glob.glob('data/*.json')):
              d = json.load(open(fp))
              slug = fp.split('/')[-1][:-5]
              name = d.get('dataset', slug).replace(' — 研究來源語料庫', '')
              rows.append(f"| {name} | https://www.myholidaytw.com/reports/{slug} |")
          table = "| 資料集 | 報告全文 |\n|---|---|\n" + "\n".join(rows)
          readme = open('README.md', encoding='utf-8').read()
          new = re.sub(r"\| 資料集 \| 報告全文 \|\n\|---\|---\|\n(\|.*\n)*", table + "\n", readme)
          open('README.md', 'w', encoding='utf-8').write(new)
          PY

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ README.md
          if git diff --staged --quiet; then
            echo "no changes"
          else
            git commit -m "chore: sync datasets $(date +%Y-%m-%d)"
            git push
          fi
