name: Sync datasets from main site

on:
  schedule:
    # 每週六 台灣時間 10:00（UTC 02:00）— 在週五產業報告生成之後
    - cron: "0 2 * * 6"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Pull latest datasets from myholidaytw/public/data
        run: |
          mkdir -p data
          # 公開 repo 淺 clone（不需 token；GITHUB_TOKEN 跨 repo API 會 404）
          git clone --depth 1 --filter=blob:none --sparse \
            https://github.com/ricky22407-lang/myholidaytw.git /tmp/src-repo
          git -C /tmp/src-repo sparse-checkout set public/data
          cp /tmp/src-repo/public/data/*.json /tmp/src-repo/public/data/*.csv data/ 2>/dev/null || true
          ls data/

      - name: Update report list in README
        run: |
          python3 - <<'PY'
          import json, glob, re
          rows = []
          for fp in sorted(glob.glob('data/*.json')):
              d = json.load(open(fp))
              slug = fp.split('/')[-1][:-5]
              name = d.get('dataset', slug).replace(' — 研究來源語料庫', '')
              rows.append(f"| {name} | https://www.myholidaytw.com/reports/{slug} |")
          table = "| 資料集 | 報告全文 |\n|---|---|\n" + "\n".join(rows)
          readme = open('README.md', encoding='utf-8').read()
          new = re.sub(r"\| 資料集 \| 報告全文 \|\n\|---\|---\|\n(\|.*\n)*", table + "\n", readme)
          open('README.md', 'w', encoding='utf-8').write(new)
          PY

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ README.md
          if git diff --staged --quiet; then
            echo "no changes"
          else
            git commit -m "chore: sync datasets $(date +%Y-%m-%d)"
            git push
          fi
